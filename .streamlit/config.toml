# Dark is the default and does not follow the system setting. The light mode is switched on in the
# page by the button at the bottom left (see ui/style.py).
# Shape rule: controls use the base radius (8px); cards and forms use 12px (see ui/style.py).
[theme]
base = "dark"
primaryColor = "#4F7DEA"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
headingFontSizes = ["1.7rem", "1.3rem", "1.1rem"]
headingFontWeights = [650, 620, 620]

[client]
toolbarMode = "minimal"
