<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SIRT Exam Seating{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f4f6fb; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }
    .stat-card { border-left: 4px solid; }
    .stat-card.primary  { border-color: #0d6efd; }
    .stat-card.success  { border-color: #198754; }
    .stat-card.warning  { border-color: #ffc107; }
    .stat-card.danger   { border-color: #dc3545; }
    .download-btn { font-size: .85rem; }
    table thead { background: #e9edf5; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">&#127963; SIRT Exam Seating</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link {% if request.endpoint == 'convert'  %}active fw-bold{% endif %}" href="{{ url_for('convert')  }}">Step 1 — Convert Result</a>
      <a class="nav-link {% if request.endpoint == 'generate' %}active fw-bold{% endif %}" href="{{ url_for('generate') }}">Step 2 — Generate Plan</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
